<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lock-container" id="lockContainer">

        <div class="circle-symbol">
            <div class="lock-symbol">🔒</div>
        </div>

        <h1>VIRTUAL LOCK</h1>
        <p class="status" id="status">ENTER CODE TO UNLOCK</p>

        <input
            type="text"
            id="codeInput"
            placeholder="Enter code..."
            maxlength="4"
            inputmode="numeric"
        >

        <button id="unlockButton">UNLOCK</button>

        <div class="secret" id="secret">
            <p>CODE WORD:</p>
            <h2>PURPLE</h2>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
